services:

  db:
    image: postgres:16
    container_name: collaborative-ide-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: IDE

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d IDE"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: collaborative-ide-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/IDE
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: collaborative-ide-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data: